version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: saas_clinica_postgres
    environment:
      POSTGRES_DB: saas_clinica
      POSTGRES_USER: clinica_user
      POSTGRES_PASSWORD: clinica_password_dev
      POSTGRES_INITDB_ARGS: "-c search_path=public"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica_user -d saas_clinica"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas_network

  redis:
    image: redis:7-alpine
    container_name: saas_clinica_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - saas_network

  adminer:
    image: adminer
    container_name: saas_clinica_adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - saas_network

volumes:
  postgres_data:
  redis_data:

networks:
  saas_network:
    driver: bridge
